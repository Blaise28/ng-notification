<div class="toast toast-bottom toast-end z-50">
  @for (toast of toasts(); track toast.id) {
    <div
      class="alert alert-soft gap-3 min-w-72 max-w-sm px-4 rounded-lg shadow-lg border border-opacity-20 transition-all"
      [class]="alertClass(toast.type)"
      tabindex="0"
      (dblclick)="dismiss(toast.id)"
      role="alert"
    >
      <span class="text-2xl shrink-0">
        <hugeicons-icon
          color="currentColor"
          [icon]="getToastIcon(toast.type)"
          [size]="24"
          [strokeWidth]="2"
          aria-hidden="true"
        />
      </span>
      <div class="flex flex-col flex-1 min-w-0">
        <span class="font-medium text-sm leading-snug">{{
          toast.title ?? getDefaultToastTitle(toast.type)
        }}</span>
        <span class="text-xs opacity-80 leading-snug mt-0.5">{{ toast.message }}</span>
      </div>

      <button
        type="button"
        class="btn btn-sm btn-{{ toast.type }} btn-soft px-1 py-1 h-auto min-h-0"
        (click)="dismiss(toast.id)"
        [attr.aria-label]="
          'Fermer la notification ' + (toast.title ?? getDefaultToastTitle(toast.type))
        "
      >
        <hugeicons-icon
          [size]="18"
          [strokeWidth]="2"
          color="currentColor"
          [icon]="cancelCircleIcon()"
          aria-hidden="true"
        />
      </button>
    </div>
  }
</div>

<dialog class="modal" id="modal_confirm" [open]="open()" role="dialog">
  <div
    class="modal-box max-w-sm flex flex-col items-center gap-6 text-center p-4 py-6"
    role="document"
  >
    <div
      class="rounded-full size-14 flex justify-center items-center"
      [class]="dialogIconBg(confirmDialog()?.type ?? '')"
      aria-hidden="true"
    >
      @let type = confirmDialog()?.type;
      @if (type) {
        <hugeicons-icon
          color="currentColor"
          [icon]="getToastIcon(type)"
          [size]="23"
          [strokeWidth]="2"
        />
      }
    </div>

    <div class="space-y-2 max-w-xs">
      <h3
        [id]="'modal-title-' + confirmDialog()?.type"
        class="font-semibold text-lg text-base-content"
      >
        {{ confirmDialog()?.title }}
      </h3>
      <p class="text-sm text-base-content/70 leading-relaxed">{{ confirmDialog()?.description }}</p>
    </div>

    <div class="modal-action mt-4 w-full flex gap-5 items-center justify-center">
      <button
        type="button"
        class="btn btn-ghost btn-sm"
        (click)="onCancel()"
        aria-label="Annuler la boîte de dialogue"
      >
        Annuler
      </button>
      <button
        type="button"
        class="btn btn-sm rounded-lg py-4 px-4 btn-{{ confirmDialog()?.type }}"
        (click)="onConfirm()"
        aria-label="Confirmer la boîte de dialogue"
      >
        Confirmer
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop pointer-events-none">
    <button type="submit" aria-label="Fermer la boîte de dialogue"></button>
  </form>
</dialog>
