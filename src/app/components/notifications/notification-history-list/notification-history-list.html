<section class="p-6 max-w-6xl mx-auto h-[calc(100vh-4rem)] flex flex-col gap-4">
  <form
    (submit)="$event.preventDefault(); applyFilters()"
    class="card bg-base-200 p-4"
    aria-label="Filtrer l'historique"
  >
    <div class="flex flex-wrap items-end gap-4">
      <fieldset class="fieldset">
        <label class="fieldset-legend text-sm" for="channel-filter">Canal</label>
        <select
          id="channel-filter"
          class="select"
          [value]="channelFilter()"
          (change)="channelFilter.set($any($event.target).value)"
        >
          <option value="">Tous</option>
          <option value="email">E-mail</option>
          <option value="sms">SMS</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
      </fieldset>
      <button type="submit" class="btn btn-secondary">Filtrer</button>
    </div>
  </form>

  <div class="flex-1 min-h-0">
    <app-list
      listTitle="Historique"
      [url]="listUrl()"
      [headers]="headers"
      [detailLink]="{ link: '/notifications/', field: 'id' }"
      [showAddButton]="true"
      [addButtonLink]="{ url: '/notifications/compose' }"
      [showFilters]="false"
      [showOverview]="false"
      [showPageSizeSelector]="true"
    />
  </div>
</section>
