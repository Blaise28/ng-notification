<div class="flex flex-col gap-3 border border-base-300 rounded-lg p-3 bg-base-100">
  <div class="flex flex-wrap items-center gap-2 justify-between">
    <div class="join">
      <button
        type="button"
        class="btn btn-xs join-item"
        [class.btn-primary]="codeTab() === 'html'"
        (click)="setCodeTab('html')"
      >
        HTML
      </button>
      <button
        type="button"
        class="btn btn-xs join-item"
        [class.btn-primary]="codeTab() === 'css'"
        (click)="setCodeTab('css')"
      >
        CSS
      </button>
    </div>
    <div class="flex flex-wrap gap-1">
      <select
        class="select select-xs"
        aria-label="Insérer une variable"
        (change)="insertVariable($any($event.target).value); $any($event.target).value = ''"
      >
        <option value="">Variable…</option>
        @for (token of variableTokens(); track token) {
          <option [value]="token">{{ labelFor(token) }}</option>
        }
      </select>
      <button type="button" class="btn btn-ghost btn-xs" (click)="insertBlock('cta')">CTA</button>
      <button type="button" class="btn btn-ghost btn-xs" (click)="insertBlock('divider')">Séparateur</button>
      <button type="button" class="btn btn-ghost btn-xs" (click)="insertBlock('info')">Encadré</button>
      <button type="button" class="btn btn-ghost btn-xs" (click)="onInsertImageClick()">Image</button>
    </div>
  </div>

  <div
    #codeHost
    class="min-h-64 rounded-lg border border-base-300 overflow-hidden text-sm"
    [attr.aria-label]="codeTab() === 'html' ? 'Éditeur HTML e-mail' : 'Éditeur CSS e-mail'"
  ></div>
</div>
