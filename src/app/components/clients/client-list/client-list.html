<section class="p-6 max-w-6xl mx-auto h-[calc(100vh-4rem)] flex flex-col gap-4">
  <form
    (submit)="$event.preventDefault(); applySubscriptionFilter()"
    class="card bg-base-200 p-4"
    aria-label="Filtrer par fin d'abonnement"
  >
    <div class="flex flex-wrap items-end gap-5">
      <fieldset class="fieldset">
        <label class="fieldset-legend text-sm" for="subscription-end-from">
          Fin d'abonnement (à partir de)
        </label>
        <input
          id="subscription-end-from"
          type="date"
          class="input h-9"
          [value]="subscriptionEndFrom()"
          (input)="subscriptionEndFrom.set($any($event.target).value)"
        />
      </fieldset>
      <fieldset class="fieldset">
        <label class="fieldset-legend text-sm" for="subscription-end-to">
          Fin d'abonnement (jusqu'à)
        </label>
        <input
          id="subscription-end-to"
          type="date"
          class="input h-9"
          [value]="subscriptionEndTo()"
          (input)="subscriptionEndTo.set($any($event.target).value)"
        />
      </fieldset>
      <button type="submit" class="btn btn-primary py-3 px-4">Filtrer</button>
      <button type="button" class="btn btn-ghost py-3 px-4" (click)="resetSubscriptionFilter()">
        Réinitialiser
      </button>
    </div>
  </form>

  <div class="flex-1 min-h-0">
    <app-list
      listTitle="Clients"
      [url]="listUrl()"
      [headers]="headers"
      [action]="actions"
      [showAddButton]="true"
      [addButtonLink]="{ url: '/clients/new' }"
      [detailLink]="{ link: '/clients/', field: 'id' }"
      [showFilters]="false"
      [showOverview]="false"
      [showPageSizeSelector]="true"
    />
  </div>
</section>
