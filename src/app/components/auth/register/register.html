<section class="min-h-screen grid grid-cols-12 bg-base-100">
  <section class="flex flex-col items-center justify-center col-span-12 lg:col-span-6 p-6">
    <div class="max-w-md w-full mx-auto">
      <div class="flex justify-between items-start mb-8 gap-4">
        <div>
          <h1 class="text-2xl font-extrabold text-primary">Inscription</h1>
          <p class="text-secondary text-sm mt-2">Créez un compte administrateur ou opérateur.</p>
        </div>
        <app-theme-controller />
      </div>

      @if (errorMessage(); as message) {
        <div role="alert" class="alert alert-error text-sm mb-4">{{ message }}</div>
      }

      <form (submit)="submitRegister($event)">
        <fieldset class="fieldset w-full">
          <legend class="fieldset-legend font-medium text-sm text-primary/90">
            Nom <code>*</code>
          </legend>
          <input
            type="text"
            [formField]="registerForm.name"
            class="input"
            placeholder="Jean Dupont"
          />
        </fieldset>
        <fieldset class="fieldset w-full mt-4">
          <legend class="fieldset-legend font-medium text-sm text-primary/90">
            E-mail <code>*</code>
          </legend>
          <input
            type="email"
            [formField]="registerForm.email"
            class="input"
            placeholder="vous@exemple.com"
            autocomplete="email"
          />
        </fieldset>
        <fieldset class="fieldset w-full mt-4">
          <legend class="fieldset-legend font-medium text-sm text-primary/90">
            Mot de passe <code>*</code>
          </legend>
          <input
            type="password"
            [formField]="registerForm.password"
            class="input"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </fieldset>
        <fieldset class="fieldset w-full mt-4">
          <legend class="fieldset-legend font-medium text-sm text-primary/90">
            Rôle <code>*</code>
          </legend>
          <select
            [formField]="registerForm.role"
            class="select w-full bg-base-200 border-secondary"
          >
            <option value="operator">Opérateur</option>
            <option value="admin">Administrateur</option>
          </select>
        </fieldset>
        <button
          [disabled]="isLoading() || registerForm().invalid()"
          type="submit"
          class="btn btn-primary w-full mt-8"
        >
          Créer le compte
          @if (isLoading()) {
            <span class="loading loading-sm ms-2"></span>
          }
        </button>
        <p class="text-xs mt-5 text-center">
          <span class="text-secondary me-1">Déjà un compte ?</span>
          <a routerLink="/login" class="text-primary font-semibold hover:underline">Se connecter</a>
        </p>
      </form>
    </div>
  </section>
  <section class="hidden lg:flex col-span-6 bg-secondary/30 items-center justify-center p-8">
    <p class="text-primary/70 text-center max-w-sm text-sm">
      Les comptes administrateur et opérateur accèdent aux fonctionnalités de notification selon
      leur rôle.
    </p>
  </section>
</section>
