<section class="p-6 max-w-6xl mx-auto h-[calc(100vh-4rem)]">
  @if (errorMessage(); as message) {
    <div role="alert" class="alert alert-error text-sm mb-4">{{ message }}</div>
  }

  <app-list
    listTitle="Organisations"
    url="/api/v1/organizations"
    [headers]="headers"
    [action]="actions"
    [showAddButton]="true"
    [addButtonLink]="{ url: '/organizations/new' }"
    [detailLink]="{ link: '/organizations/', field: 'id' }"
    [showFilters]="false"
    [showOverview]="false"
    [showPageSizeSelector]="true"
  />
</section>
